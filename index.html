<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>函数绘制器 · Function Plotter</title>
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar">
      <header class="brand">
        <div class="logo">ƒ</div>
        <div>
          <h1>函数绘制器</h1>
          <p class="sub">输入函数 · 实时绘制</p>
        </div>
      </header>

      <div class="toolbar">
        <button id="add-fn" class="btn primary">＋ 添加函数</button>
        <button id="reset-view" class="btn" title="重置视图 (0)">⟲ 重置</button>
        <button id="zoom-in" class="btn" title="放大 (+)">＋镜</button>
        <button id="zoom-out" class="btn" title="缩小 (−)">－镜</button>
      </div>

      <div class="io-bar">
        <button id="export-set" class="btn io" title="导出当前函数集与钉选点为 JSON 文件">⬇ 导出</button>
        <button id="import-set" class="btn io" title="从 JSON 文件导入函数集与钉选点">⬆ 导入</button>
        <input id="import-file" type="file" accept=".json,application/json" style="display:none" />
      </div>

      <div id="fn-list" class="fn-list"></div>
    </aside>

    <!-- 绘图区 -->
    <main class="stage">
      <canvas id="plot"></canvas>
      <div id="readout" class="readout"></div>
      <div id="hoverbox" class="hoverbox"></div>
      <div class="hint">拖动平移 · 滚轮缩放 · 点击特殊点钉选坐标</div>
    </main>
  </div>

  <script src="expr.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
